name: Import verified dinner source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify and import the prepared source snapshot
        shell: bash
        run: |
          set -euo pipefail
          echo "acab934b3b43ca0daa4ffcf906e44d93d40c9e832bd90a4c360b048526bad5a7  tonight-dinner-1.1.0-source.zip" | sha256sum --check
          unpack_dir="$(mktemp -d)"
          unzip -q tonight-dinner-1.1.0-source.zip -d "$unpack_dir"
          rsync -a --delete --exclude=.git/ "$unpack_dir/tonight-dinner-ai-passport/" ./
          git add -A
          test "$(git write-tree)" = "36005bab5b32289164222f2c21eb260c319007dd"
          git -c user.name=Edison1213812138 -c user.email=67045785+Edison1213812138@users.noreply.github.com commit -m "feat(dinner): publish verified dinner application source" -m "Source snapshot: b54abbd7f9a1d609e6aa2ae921780d43e526066b"
          git push origin HEAD:main
          git tag v1.1.0-dinner
          git push origin refs/tags/v1.1.0-dinner
